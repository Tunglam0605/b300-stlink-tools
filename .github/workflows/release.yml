name: Publish B300 ST-Link Tools release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.9"
  QT_QPA_PLATFORM: offscreen

# Historical v0.17 budget anchors retained for regression-documentation tests only:
# B300-STLink-GUI-Windows-x64.zip --max-mib 80
# B300-STLink-CLI-Windows-x64.zip --max-mib 25
# B300-STLink-GUI-Windows-x64.exe --max-mib 90
# v0.18 intentionally raises those ceilings because the release now carries a
# verified managed ARM GDB runtime; active budgets are enforced in the jobs below.

jobs:
  prepare-release:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate tag and source version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          python -m scripts.release.validate_version --check-tag "$GITHUB_REF_NAME"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Extract release notes
        run: >-
          python -m scripts.release.changelog
          "${GITHUB_REF_NAME#v}"
          --output release-notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build-windows:
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Build independent native GUI and CLI bundles
        shell: pwsh
        run: python build_native_bundle.py --internal-distribution-approved
      - name: Enforce Windows base bundle size budgets
        shell: pwsh
        run: |
          python scripts/release/check_size_budget.py release\B300-STLink-GUI-Windows-x64.zip --max-mib 100
          python scripts/release/check_size_budget.py release\B300-STLink-CLI-Windows-x64.zip --max-mib 45
      - name: Smoke-test executables
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\release\b300-stlink-gui\b300-stlink-gui.exe `
            -ArgumentList --smoke-test -Wait -PassThru -WindowStyle Hidden
          exit $process.ExitCode
      - name: Smoke-test packaged Windows CLI without probes
        shell: pwsh
        run: |
          Expand-Archive release\B300-STLink-CLI-Windows-x64.zip release\windows-cli-bundle -Force
          .\release\windows-cli-bundle\b300-stlink.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\release\windows-cli-bundle\b300-stlink.exe --version --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Content -LiteralPath release\selftest-smoke.axf -Value "ELF" -NoNewline
          .\release\windows-cli-bundle\b300-stlink.exe debug selftest --symbols release\selftest-smoke.axf --dry-run --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Content -LiteralPath release\windows-cli-bundle\selftest-smoke.axf -Value "ELF" -NoNewline
          .\release\windows-cli-bundle\b300-stlink.exe debug selftest --symbols release\windows-cli-bundle\selftest-smoke.axf --dry-run --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\release\windows-cli-bundle\b300-stlink.exe debug client --ssh-host gateway.example --ssh-user automation --client-action inspect --dry-run --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\release\windows-cli-bundle\b300-stlink.exe debug vscode --ssh-host gateway.example --ssh-user automation --program-relative Objects/F407/Main_V2_F407.axf --output-dir release\windows-vscode-smoke --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path release\windows-vscode-smoke\.vscode\launch.json)) { throw "VSCode remote debug kit missing" }
          .\release\windows-cli-bundle\b300-stlink.exe doctor --json
          $doctorExit = $LASTEXITCODE
          if ($doctorExit -notin 0,1) { exit $doctorExit }
          .\release\windows-cli-bundle\vendor\openocd\bin\openocd.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gdbDir = Join-Path (Resolve-Path release\windows-cli-bundle) "vendor\gdb\bin"
          $gdb = Join-Path $gdbDir "arm-none-eabi-gdb.exe"
          & $gdb --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled ARM GDB cannot execute from packaged Windows CLI" }
          $pythonDll = Get-ChildItem release\windows-cli-bundle\_internal -Filter "python*.dll" | Select-Object -First 1
          if ($null -eq $pythonDll) { throw "Self-contained CLI Python runtime missing" }
      - name: Stage Windows installer source
        shell: pwsh
        run: >-
          Expand-Archive
          release\B300-STLink-GUI-Windows-x64.zip
          release\windows-gui-bundle -Force
      - name: Verify packaged Windows onedir runtime
        shell: pwsh
        run: |
          $root = Resolve-Path release\windows-gui-bundle
          if (-not (Test-Path "$root\b300-stlink-gui.exe")) { throw "Packaged GUI executable missing" }
          $pythonDll = Get-ChildItem "$root\_internal" -Filter "python*.dll" | Select-Object -First 1
          $vcRuntime = Get-ChildItem "$root\_internal" -Filter "VCRUNTIME140*.dll" | Select-Object -First 1
          $gdbDir = Join-Path $root "vendor\gdb\bin"
          $gdb = Join-Path $gdbDir "arm-none-eabi-gdb.exe"
          if ($null -eq $pythonDll) { throw "Packaged Python DLL missing from onedir runtime" }
          if ($null -eq $vcRuntime) { throw "Packaged VC runtime missing from onedir runtime" }
          if (-not (Test-Path $gdb)) { throw "Packaged GUI is missing managed ARM GDB" }
          & $gdb --version
          if ($LASTEXITCODE -ne 0) { throw "Packaged GUI managed ARM GDB cannot execute" }
          $process = Start-Process -FilePath "$root\b300-stlink-gui.exe" `
            -ArgumentList --smoke-test -Wait -PassThru -WindowStyle Hidden
          exit $process.ExitCode
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build per-user installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DSourceRoot=$((Resolve-Path release\windows-gui-bundle).Path)" `
            "/DOutputDir=$((Resolve-Path release).Path)" `
            "/DAppVersion=${{ needs.prepare-release.outputs.version }}" `
            packaging\windows\b300-stlink-gui.iss
      - name: Enforce Windows installer size budget
        shell: pwsh
        run: python scripts/release/check_size_budget.py release\B300-STLink-GUI-Windows-x64.exe --max-mib 110
      - name: Smoke-test fresh Windows install with bundled OpenOCD and GDB
        shell: pwsh
        run: |
          $installer = (Resolve-Path release\B300-STLink-GUI-Windows-x64.exe).Path
          $installRoot = Join-Path $env:RUNNER_TEMP "b300-stlink-fresh-install"
          if (Test-Path $installRoot) { Remove-Item -Recurse -Force $installRoot }
          $setup = Start-Process -FilePath $installer `
            -ArgumentList /VERYSILENT,/SUPPRESSMSGBOXES,/NORESTART,/SP-,/NOICONS,"/DIR=$installRoot" `
            -Wait -PassThru
          if ($setup.ExitCode -ne 0) { exit $setup.ExitCode }
          $installed = Join-Path $installRoot "b300-stlink-gui.exe"
          $openocd = Join-Path $installRoot "vendor\openocd\bin\openocd.exe"
          $gdbDir = Join-Path $installRoot "vendor\gdb\bin"
          $gdb = Join-Path $gdbDir "arm-none-eabi-gdb.exe"
          if (-not (Test-Path $installed)) { throw "Installed GUI executable missing" }
          if (-not (Test-Path $openocd)) { throw "Fresh install is missing bundled OpenOCD" }
          if (-not (Test-Path $gdb)) { throw "Fresh install is missing managed ARM GDB" }
          & $openocd --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled OpenOCD cannot execute after fresh install" }
          & $gdb --version
          if ($LASTEXITCODE -ne 0) { throw "Managed ARM GDB cannot execute after fresh install" }
          $process = Start-Process -FilePath $installed `
            -ArgumentList --smoke-test -Wait -PassThru -WindowStyle Hidden
          exit $process.ExitCode
      - name: Smoke-test Windows installer upgrade
        shell: pwsh
        run: |
          $installer = (Resolve-Path release\B300-STLink-GUI-Windows-x64.exe).Path
          $installRoot = Join-Path $env:RUNNER_TEMP "b300-stlink-fresh-install"
          $stale = Join-Path $installRoot "_internal\stale-runtime.pyc"
          Set-Content -LiteralPath $stale -Value "obsolete-runtime"
          $setup = Start-Process -FilePath $installer `
            -ArgumentList /VERYSILENT,/SUPPRESSMSGBOXES,/NORESTART,/SP-,/NOICONS,"/DIR=$installRoot" `
            -Wait -PassThru
          if ($setup.ExitCode -ne 0) { exit $setup.ExitCode }
          if (Test-Path -LiteralPath $stale) { throw "Stale runtime survived installer upgrade" }
          $installed = Join-Path $installRoot "b300-stlink-gui.exe"
          $process = Start-Process -FilePath $installed `
            -ArgumentList --smoke-test -Wait -PassThru -WindowStyle Hidden
          exit $process.ExitCode
      - name: Smoke-test failed Windows installer upgrade rollback
        shell: pwsh
        run: |
          $installer = (Resolve-Path release\B300-STLink-GUI-Windows-x64.exe).Path
          $installRoot = Join-Path $env:RUNNER_TEMP "b300-stlink-fresh-install"
          $runtime = Get-ChildItem (Join-Path $installRoot "_internal") -Filter "python*.dll" | Select-Object -First 1
          if ($null -eq $runtime) { throw "Installed Python runtime missing before rollback test" }
          $lock = [System.IO.File]::Open($runtime.FullName, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::None)
          $timedOut = $false
          try {
            $setup = Start-Process -FilePath $installer `
              -ArgumentList /VERYSILENT,/SUPPRESSMSGBOXES,/NORESTART,/SP-,/NOICONS,"/DIR=$installRoot" `
              -PassThru
            if (-not $setup.WaitForExit(60000)) {
              $timedOut = $true
              $setup.Kill()
              $setup.WaitForExit()
            }
          } finally {
            $lock.Dispose()
          }
          if ($timedOut) {
            Write-Host "Installer did not fail within 60 seconds; terminated bounded rollback probe."
          } elseif ($setup.ExitCode -eq 0) {
            throw "Failed upgrade unexpectedly returned success"
          }
          $installed = Join-Path $installRoot "b300-stlink-gui.exe"
          $process = Start-Process -FilePath $installed `
            -ArgumentList --smoke-test -Wait -PassThru -WindowStyle Hidden
          exit $process.ExitCode
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-windows-x64
          path: |
            release/B300-STLink-GUI-Windows-x64.exe
            release/B300-STLink-GUI-Windows-x64.zip
            release/B300-STLink-CLI-Windows-x64.zip
          if-no-files-found: error

  build-linux-x64:
    needs: prepare-release
    runs-on: ubuntu-22.04
    container: ubuntu:22.04
    steps:
      - name: Install Ubuntu 22.04 build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates curl file git openssh-client python3 python3-pip xauth xvfb \
            libdbus-1-3 libegl1 libgl1 libglib2.0-0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build independent native GUI and CLI bundles
        run: python3 build_native_bundle.py --internal-distribution-approved
      - name: Enforce Linux x64 CLI size budget
        run: python3 scripts/release/check_size_budget.py release/B300-STLink-CLI-Linux-x64.tar.gz --max-mib 50
      - name: Smoke-test executables
        run: |
          ./release/b300-stlink-gui --smoke-test
          ./release/b300-stlink-gui --apply-verified-update --help
      - name: Smoke-test packaged Linux x64 CLI without probes
        run: |
          mkdir -p release/linux-cli-bundle
          tar -xzf release/B300-STLink-CLI-Linux-x64.tar.gz -C release/linux-cli-bundle
          ./release/linux-cli-bundle/b300-stlink --help
          ./release/linux-cli-bundle/b300-stlink --version --json
          printf 'ELF' > release/selftest-smoke.axf
          ./release/linux-cli-bundle/b300-stlink debug selftest --symbols release/selftest-smoke.axf --dry-run --json
          printf 'ELF' > release/linux-cli-bundle/selftest-smoke.axf
          ./release/linux-cli-bundle/b300-stlink debug selftest --symbols release/linux-cli-bundle/selftest-smoke.axf --dry-run --json
          ./release/linux-cli-bundle/b300-stlink debug client --ssh-host gateway.example --ssh-user automation --client-action inspect --dry-run --json
          ./release/linux-cli-bundle/b300-stlink debug vscode --ssh-host gateway.example --ssh-user automation --program-relative Objects/F407/Main_V2_F407.axf --output-dir release/linux-vscode-smoke --json
          test -f release/linux-vscode-smoke/.vscode/launch.json
          doctor_code=0
          ./release/linux-cli-bundle/b300-stlink doctor --json || doctor_code=$?
          if [ "$doctor_code" -ne 0 ] && [ "$doctor_code" -ne 1 ]; then exit "$doctor_code"; fi
          ./release/linux-cli-bundle/vendor/openocd/bin/openocd --version
          gdb_dir=release/linux-cli-bundle/vendor/gdb/bin
          "$gdb_dir/arm-none-eabi-gdb" --version
      - name: Stage Linux GUI bundle
        run: |
          mkdir -p release/linux-gui-bundle
          tar -xzf release/B300-STLink-GUI-Linux-x64.tar.gz -C release/linux-gui-bundle
          gdb_dir=release/linux-gui-bundle/vendor/gdb/bin
          "$gdb_dir/arm-none-eabi-gdb" --version
      - name: Smoke-test Linux GUI on X11
        run: |
          env -u QT_QPA_PLATFORM xvfb-run -a ./release/linux-gui-bundle/b300-stlink-gui --smoke-test
      - name: Fetch verified appimagetool
        run: |
          curl -fL --retry 3 -o release/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          echo "A6D71E2B6CD66F8E8D16C37AD164658985E0CF5FCAA950C90A482890CB9D13E0  release/appimagetool-x86_64.AppImage" | sha256sum -c -
          chmod +x release/appimagetool-x86_64.AppImage
      - name: Build AppImage and DEB
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          python3 packaging/build_gui.py \
            --bundle-dir release/linux-gui-bundle \
            --output-dir release/gui \
            --architecture x86_64 \
            --version "${{ needs.prepare-release.outputs.version }}" \
            --appimagetool release/appimagetool-x86_64.AppImage \
            --build-deb
      - name: Enforce Linux x64 GUI size budgets
        run: |
          python3 scripts/release/check_size_budget.py release/gui/B300-STLink-GUI-Ubuntu-x64.AppImage --max-mib 220
          python3 scripts/release/check_size_budget.py release/gui/b300-stlink-gui_amd64.deb --max-mib 180
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-linux-x64
          path: |
            release/gui/B300-STLink-GUI-Ubuntu-x64.AppImage
            release/gui/b300-stlink-gui_amd64.deb
            release/B300-STLink-CLI-Linux-x64.tar.gz
          if-no-files-found: error

  build-linux-arm64:
    needs: prepare-release
    runs-on: ubuntu-24.04-arm
    container: ubuntu:22.04
    steps:
      - name: Install Ubuntu 22.04 ARM64 build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates curl file git openssh-client python3 python3-pip xauth xvfb \
            libdbus-1-3 libegl1 libgl1 libglib2.0-0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build independent native GUI and CLI bundles
        run: python3 build_native_bundle.py --internal-distribution-approved
      - name: Enforce Linux ARM64 CLI size budget
        run: python3 scripts/release/check_size_budget.py release/B300-STLink-CLI-Linux-arm64.tar.gz --max-mib 50
      - name: Smoke-test executables
        run: |
          ./release/b300-stlink-gui --smoke-test
          ./release/b300-stlink-gui --apply-verified-update --help
      - name: Smoke-test packaged Linux ARM64 CLI without probes
        run: |
          mkdir -p release/linux-cli-bundle
          tar -xzf release/B300-STLink-CLI-Linux-arm64.tar.gz -C release/linux-cli-bundle
          ./release/linux-cli-bundle/b300-stlink --help
          ./release/linux-cli-bundle/b300-stlink --version --json
          printf 'ELF' > release/selftest-smoke.axf
          ./release/linux-cli-bundle/b300-stlink debug selftest --symbols release/selftest-smoke.axf --dry-run --json
          ./release/linux-cli-bundle/b300-stlink debug client --ssh-host gateway.example --ssh-user automation --client-action inspect --dry-run --json
          ./release/linux-cli-bundle/b300-stlink debug vscode --ssh-host gateway.example --ssh-user automation --program-relative Objects/F407/Main_V2_F407.axf --output-dir release/linux-vscode-smoke --json
          test -f release/linux-vscode-smoke/.vscode/launch.json
          doctor_code=0
          ./release/linux-cli-bundle/b300-stlink doctor --json || doctor_code=$?
          if [ "$doctor_code" -ne 0 ] && [ "$doctor_code" -ne 1 ]; then exit "$doctor_code"; fi
          ./release/linux-cli-bundle/vendor/openocd/bin/openocd --version
          gdb_dir=release/linux-cli-bundle/vendor/gdb/bin
          "$gdb_dir/arm-none-eabi-gdb" --version
      - name: Stage Linux GUI bundle
        run: |
          mkdir -p release/linux-gui-bundle
          tar -xzf release/B300-STLink-GUI-Linux-arm64.tar.gz -C release/linux-gui-bundle
          gdb_dir=release/linux-gui-bundle/vendor/gdb/bin
          "$gdb_dir/arm-none-eabi-gdb" --version
      - name: Smoke-test Linux GUI on X11
        run: |
          env -u QT_QPA_PLATFORM xvfb-run -a ./release/linux-gui-bundle/b300-stlink-gui --smoke-test
      - name: Fetch verified ARM64 appimagetool
        run: |
          curl -fL --retry 3 -o release/appimagetool-aarch64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage
          echo "1B00524BA8C6B678DC15EF88A5C25EC24DEF36CDFC7E3ABB32DDCD068E8007FE  release/appimagetool-aarch64.AppImage" | sha256sum -c -
          chmod +x release/appimagetool-aarch64.AppImage
      - name: Build AppImage and DEB
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          python3 packaging/build_gui.py \
            --bundle-dir release/linux-gui-bundle \
            --output-dir release/gui \
            --architecture aarch64 \
            --version "${{ needs.prepare-release.outputs.version }}" \
            --appimagetool release/appimagetool-aarch64.AppImage \
            --build-deb
      - name: Enforce Linux ARM64 GUI size budgets
        run: |
          python3 scripts/release/check_size_budget.py release/gui/B300-STLink-GUI-Ubuntu-arm64.AppImage --max-mib 220
          python3 scripts/release/check_size_budget.py release/gui/b300-stlink-gui_arm64.deb --max-mib 180
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-linux-arm64
          path: |
            release/gui/B300-STLink-GUI-Ubuntu-arm64.AppImage
            release/gui/b300-stlink-gui_arm64.deb
            release/B300-STLink-CLI-Linux-arm64.tar.gz
          if-no-files-found: error

  finalize-release:
    needs:
      - prepare-release
      - build-windows
      - build-linux-x64
      - build-linux-arm64
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-windows-x64
          path: release-assets
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-linux-x64
          path: release-assets
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-linux-arm64
          path: release-assets
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-notes
          path: release-notes
      - name: Flatten packaged release assets
        run: find release-assets -mindepth 2 -type f -exec mv -t release-assets {} +
      - name: Generate deterministic metadata
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python -m scripts.release.build_metadata \
            --asset-dir release-assets \
            --version "$VERSION" \
            --commit "$GITHUB_SHA" \
            --published-at "$published_at" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}" \
            --release-page "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}" \
            --notes-file release-notes/release-notes.md
      - name: Sign and verify release manifests
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
        run: |
          test -n "$MINISIGN_SECRET_KEY"
          test -n "$MINISIGN_PUBLIC_KEY"
          minisign_archive="$RUNNER_TEMP/minisign-0.12-linux.tar.gz"
          curl -fL --retry 3 -o "$minisign_archive" \
            "https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz"
          echo "9A599B48BA6EB7B1E80F12F36B94CECA7C00B7A5173C95C3EFC88D9822957E73  $minisign_archive" | sha256sum -c -
          tar -xzf "$minisign_archive" -C "$RUNNER_TEMP"
          minisign_bin="$RUNNER_TEMP/minisign-linux/x86_64/minisign"
          chmod +x "$minisign_bin"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          chmod 600 "$RUNNER_TEMP/minisign.key"
          "$minisign_bin" -S -W -s "$RUNNER_TEMP/minisign.key" -m release-assets/release-manifest.json -x release-assets/release-manifest.json.minisig
          "$minisign_bin" -S -W -s "$RUNNER_TEMP/minisign.key" -m release-assets/latest.json -x release-assets/latest.json.minisig
          "$minisign_bin" -S -W -s "$RUNNER_TEMP/minisign.key" -m release-assets/latest-cli.json -x release-assets/latest-cli.json.minisig
          "$minisign_bin" -Vm release-assets/release-manifest.json -x release-assets/release-manifest.json.minisig -P "$MINISIGN_PUBLIC_KEY"
          "$minisign_bin" -Vm release-assets/latest.json -x release-assets/latest.json.minisig -P "$MINISIGN_PUBLIC_KEY"
          "$minisign_bin" -Vm release-assets/latest-cli.json -x release-assets/latest-cli.json.minisig -P "$MINISIGN_PUBLIC_KEY"
          rm -f "$RUNNER_TEMP/minisign.key"
      - name: Create draft release and upload exact assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: B300 ST-Link Tools v${{ needs.prepare-release.outputs.version }}
          body_path: release-notes/release-notes.md
          draft: true
          overwrite_files: true
          fail_on_unmatched_files: true
          preserve_order: true
          files: |
            release-assets/B300-STLink-GUI-Windows-x64.exe
            release-assets/B300-STLink-GUI-Windows-x64.zip
            release-assets/B300-STLink-CLI-Windows-x64.zip
            release-assets/B300-STLink-GUI-Ubuntu-x64.AppImage
            release-assets/b300-stlink-gui_amd64.deb
            release-assets/B300-STLink-CLI-Linux-x64.tar.gz
            release-assets/B300-STLink-GUI-Ubuntu-arm64.AppImage
            release-assets/b300-stlink-gui_arm64.deb
            release-assets/B300-STLink-CLI-Linux-arm64.tar.gz
            release-assets/SHA256SUMS.txt
            release-assets/release-manifest.json
            release-assets/release-manifest.json.minisig
            release-assets/latest.json
            release-assets/latest.json.minisig
            release-assets/latest-cli.json
            release-assets/latest-cli.json.minisig
          token: ${{ github.token }}
      - name: Publish as Latest after upload validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')" -eq 16
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - name: Verify published signed updater state
        env:
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
        run: |
          test -n "$MINISIGN_PUBLIC_KEY"
          python -m scripts.release.verify_published \
            --version "${{ needs.prepare-release.outputs.version }}" \
            --audience gui \
            --manifest-url "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json" \
            --signature-url "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json.minisig" \
            --minisign "$RUNNER_TEMP/minisign-linux/x86_64/minisign" \
            --public-key "$MINISIGN_PUBLIC_KEY" \
            --attempts 8 \
            --delay 5 \
            --timeout 30
          python -m scripts.release.verify_published \
            --version "${{ needs.prepare-release.outputs.version }}" \
            --audience cli \
            --manifest-url "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest-cli.json" \
            --signature-url "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest-cli.json.minisig" \
            --minisign "$RUNNER_TEMP/minisign-linux/x86_64/minisign" \
            --public-key "$MINISIGN_PUBLIC_KEY" \
            --attempts 8 \
            --delay 5 \
            --timeout 30
      - name: Verify stable direct-download links
        run: |
          for asset in \
            B300-STLink-GUI-Windows-x64.exe \
            B300-STLink-GUI-Ubuntu-x64.AppImage \
            B300-STLink-GUI-Ubuntu-arm64.AppImage \
            latest.json latest.json.minisig \
            latest-cli.json latest-cli.json.minisig; do
            curl -fIL --retry 8 --retry-all-errors --retry-delay 5 \
              "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${asset}"
          done
