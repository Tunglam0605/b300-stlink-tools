name: Development packages (no publishing)

on:
  workflow_dispatch:
  push:
    branches:
      - "develop/**"

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen

concurrency:
  group: development-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.9"
      - run: python build_native_bundle.py --internal-distribution-approved
      - name: Enforce Windows base bundle size budgets
        shell: pwsh
        run: |
          python scripts/release/check_size_budget.py release\B300-STLink-GUI-Windows-x64.zip --max-mib 100
          python scripts/release/check_size_budget.py release\B300-STLink-CLI-Windows-x64.zip --max-mib 45
      - name: Smoke-test native executables
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\release\b300-stlink-gui\b300-stlink-gui.exe `
            -ArgumentList --smoke-test -Wait -PassThru -WindowStyle Hidden
          exit $process.ExitCode
      - name: Smoke-test packaged Windows CLI without probes
        shell: pwsh
        run: |
          Expand-Archive release\B300-STLink-CLI-Windows-x64.zip release\windows-cli-bundle -Force
          .\release\windows-cli-bundle\b300-stlink.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\release\windows-cli-bundle\b300-stlink.exe --version --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Content -LiteralPath release\selftest-smoke.axf -Value "ELF" -NoNewline
          .\release\windows-cli-bundle\b300-stlink.exe debug selftest --symbols release\selftest-smoke.axf --dry-run --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Content -LiteralPath release\windows-cli-bundle\selftest-smoke.axf -Value "ELF" -NoNewline
          .\release\windows-cli-bundle\b300-stlink.exe debug selftest --symbols release\windows-cli-bundle\selftest-smoke.axf --dry-run --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\release\windows-cli-bundle\b300-stlink.exe debug client --ssh-host gateway.example --ssh-user automation --client-action inspect --dry-run --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\release\windows-cli-bundle\b300-stlink.exe debug vscode --ssh-host gateway.example --ssh-user automation --program-relative Objects/F407/Main_V2_F407.axf --output-dir release\windows-vscode-smoke --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path release\windows-vscode-smoke\.vscode\launch.json)) { throw "VSCode remote debug kit missing" }
          .\release\windows-cli-bundle\b300-stlink.exe doctor --json
          $doctorExit = $LASTEXITCODE
          if ($doctorExit -notin 0,1) { exit $doctorExit }
          .\release\windows-cli-bundle\vendor\openocd\bin\openocd.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\release\windows-cli-bundle\vendor\gdb\bin\arm-none-eabi-gdb.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled ARM GDB cannot execute from packaged Windows CLI" }
          $pythonDll = Get-ChildItem release\windows-cli-bundle\_internal -Filter "python*.dll" | Select-Object -First 1
          if ($null -eq $pythonDll) { throw "Self-contained CLI Python runtime missing" }
      - name: Build Windows installer
        shell: pwsh
        run: |
          Expand-Archive release\B300-STLink-GUI-Windows-x64.zip release\windows-gui-bundle -Force
          choco install innosetup --no-progress -y
          $version = python -c "from b300_version import __version__; print(__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DSourceRoot=$((Resolve-Path release\windows-gui-bundle).Path)" `
            "/DOutputDir=$((Resolve-Path release).Path)" `
            "/DAppVersion=$version" packaging\windows\b300-stlink-gui.iss
      - name: Enforce Windows installer size budget
        shell: pwsh
        run: python scripts/release/check_size_budget.py release\B300-STLink-GUI-Windows-x64.exe --max-mib 110
      - name: Smoke-test fresh Windows install with bundled OpenOCD and GDB
        shell: pwsh
        run: |
          $installer = (Resolve-Path release\B300-STLink-GUI-Windows-x64.exe).Path
          $installRoot = Join-Path $env:RUNNER_TEMP "b300-stlink-fresh-install"
          if (Test-Path $installRoot) { Remove-Item -Recurse -Force $installRoot }
          $setup = Start-Process -FilePath $installer `
            -ArgumentList /VERYSILENT,/SUPPRESSMSGBOXES,/NORESTART,/SP-,/NOICONS,"/DIR=$installRoot" `
            -Wait -PassThru
          if ($setup.ExitCode -ne 0) { exit $setup.ExitCode }
          $installed = Join-Path $installRoot "b300-stlink-gui.exe"
          $openocd = Join-Path $installRoot "vendor\openocd\bin\openocd.exe"
          $gdb = Join-Path $installRoot "vendor\gdb\bin\arm-none-eabi-gdb.exe"
          if (-not (Test-Path $installed)) { throw "Installed GUI executable missing" }
          if (-not (Test-Path $openocd)) { throw "Fresh install is missing bundled OpenOCD" }
          if (-not (Test-Path $gdb)) { throw "Fresh install is missing managed ARM GDB" }
          & $openocd --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled OpenOCD cannot execute after fresh install" }
          & $gdb --version
          if ($LASTEXITCODE -ne 0) { throw "Managed ARM GDB cannot execute after fresh install" }
          $process = Start-Process -FilePath $installed `
            -ArgumentList --smoke-test -Wait -PassThru -WindowStyle Hidden
          exit $process.ExitCode
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dry-run-windows
          path: |
            release/B300-STLink-GUI-Windows-x64.zip
            release/B300-STLink-GUI-Windows-x64.exe
            release/B300-STLink-CLI-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: x64
            gui: B300-STLink-GUI-Linux-x64.tar.gz
            cli: B300-STLink-CLI-Linux-x64.tar.gz
            architecture: x86_64
            appimagetool: appimagetool-x86_64.AppImage
            appimagetool_sha256: A6D71E2B6CD66F8E8D16C37AD164658985E0CF5FCAA950C90A482890CB9D13E0
            appimage: B300-STLink-GUI-Ubuntu-x64.AppImage
            deb: b300-stlink-gui_amd64.deb
          - runner: ubuntu-24.04-arm
            platform: arm64
            gui: B300-STLink-GUI-Linux-arm64.tar.gz
            cli: B300-STLink-CLI-Linux-arm64.tar.gz
            architecture: aarch64
            appimagetool: appimagetool-aarch64.AppImage
            appimagetool_sha256: 1B00524BA8C6B678DC15EF88A5C25EC24DEF36CDFC7E3ABB32DDCD068E8007FE
            appimage: B300-STLink-GUI-Ubuntu-arm64.AppImage
            deb: b300-stlink-gui_arm64.deb
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    steps:
      - run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates curl file git openssh-client python3 python3-pip \
            libdbus-1-3 libegl1 libgl1 libglib2.0-0 libxkbcommon-x11-0 libxcb-cursor0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 build_native_bundle.py --internal-distribution-approved
      - name: Enforce Linux CLI size budget
        run: python3 scripts/release/check_size_budget.py "release/${{ matrix.cli }}" --max-mib 50
      - run: |
          ./release/b300-stlink-gui --smoke-test
          ./release/b300-stlink-gui --apply-verified-update --help
      - name: Smoke-test packaged Linux CLI without probes
        run: |
          mkdir -p release/linux-cli-bundle
          tar -xzf "release/${{ matrix.cli }}" -C release/linux-cli-bundle
          ./release/linux-cli-bundle/b300-stlink --help
          ./release/linux-cli-bundle/b300-stlink --version --json
          printf 'ELF' > release/selftest-smoke.axf
          ./release/linux-cli-bundle/b300-stlink debug selftest --symbols release/selftest-smoke.axf --dry-run --json
          printf 'ELF' > release/linux-cli-bundle/selftest-smoke.axf
          ./release/linux-cli-bundle/b300-stlink debug selftest --symbols release/linux-cli-bundle/selftest-smoke.axf --dry-run --json
          ./release/linux-cli-bundle/b300-stlink debug client --ssh-host gateway.example --ssh-user automation --client-action inspect --dry-run --json
          ./release/linux-cli-bundle/b300-stlink debug vscode --ssh-host gateway.example --ssh-user automation --program-relative Objects/F407/Main_V2_F407.axf --output-dir release/linux-vscode-smoke --json
          test -f release/linux-vscode-smoke/.vscode/launch.json
          doctor_code=0
          ./release/linux-cli-bundle/b300-stlink doctor --json || doctor_code=$?
          if [ "$doctor_code" -ne 0 ] && [ "$doctor_code" -ne 1 ]; then exit "$doctor_code"; fi
          ./release/linux-cli-bundle/vendor/openocd/bin/openocd --version
          ./release/linux-cli-bundle/vendor/gdb/bin/arm-none-eabi-gdb --version
      - name: Build AppImage and DEB
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p release/linux-gui-bundle release/gui
          tar -xzf "release/${{ matrix.gui }}" -C release/linux-gui-bundle
          curl -fL --retry 3 -o "release/${{ matrix.appimagetool }}" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/${{ matrix.appimagetool }}"
          echo "${{ matrix.appimagetool_sha256 }}  release/${{ matrix.appimagetool }}" | sha256sum -c -
          chmod +x "release/${{ matrix.appimagetool }}"
          version=$(python3 -c 'from b300_version import __version__; print(__version__)')
          python3 packaging/build_gui.py \
            --bundle-dir release/linux-gui-bundle \
            --output-dir release/gui \
            --architecture "${{ matrix.architecture }}" \
            --version "$version" \
            --appimagetool "release/${{ matrix.appimagetool }}" \
            --build-deb
      - name: Enforce Linux GUI size budgets
        run: |
          python3 scripts/release/check_size_budget.py "release/gui/${{ matrix.appimage }}" --max-mib 220
          python3 scripts/release/check_size_budget.py "release/gui/${{ matrix.deb }}" --max-mib 180
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dry-run-linux-${{ matrix.platform }}
          path: |
            release/${{ matrix.gui }}
            release/${{ matrix.cli }}
            release/gui/${{ matrix.appimage }}
            release/gui/${{ matrix.deb }}
          if-no-files-found: error
          retention-days: 7
