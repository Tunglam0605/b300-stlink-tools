name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }} / Python 3.9
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x64
            runner: ubuntu-latest
          - name: Ubuntu ARM64
            runner: ubuntu-24.04-arm
          - name: Windows x64
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.9"

      - name: Install Ubuntu GUI runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Run unit tests (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install -r requirements-test.txt
          timeout --signal=TERM 180 python -m unittest discover -s tests -q

      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install -r requirements-test.txt
          # PySide/Qt native state can leak across unittest modules on Windows
          # runners and terminate the shared interpreter without a Python
          # traceback. Run each module in a fresh process so a module owns its
          # QApplication/QThread lifecycle and failures remain attributable.
          $tests = Get-ChildItem tests -Filter 'test_*.py' | Sort-Object Name
          foreach ($test in $tests) {
            $module = 'tests.' + $test.BaseName
            Write-Host "=== $module ==="
            python -m unittest $module -q
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Compile Python sources
        run: >-
          python -m py_compile
          b300_stlink.py
          b300_gui_entry.py
          build_native_bundle.py
          package_internal.py
          packaging/build_gui.py
          scripts/install_skill.py

      - name: Compile packages
        run: python -m compileall -q b300_core b300_gui

      - name: Check CLI help
        run: |
          python b300_stlink.py --help
          python b300_stlink.py debug --help
          python -m b300_gui --smoke-test
          python scripts/install_skill.py --help
