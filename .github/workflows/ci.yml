name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }} / Python 3.9
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x64
            runner: ubuntu-latest
          - name: Ubuntu ARM64
            runner: ubuntu-24.04-arm
          - name: Windows x64
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Run unit tests
        run: |
          python -m pip install -r requirements-gui.txt
          python -m unittest discover -s tests -q

      - name: Compile Python sources
        run: >-
          python -m py_compile
          b300_stlink.py
          b300_gui_entry.py
          build_native_bundle.py
          package_internal.py
          packaging/build_gui.py
          scripts/install_skill.py

      - name: Compile packages
        run: python -m compileall -q b300_core b300_gui

      - name: Check CLI help
        run: |
          python b300_stlink.py --help
          python b300_stlink.py debug --help
          python -m b300_gui --smoke-test
          python scripts/install_skill.py --help
