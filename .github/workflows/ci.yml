name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }} / Python 3.9
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x64
            runner: ubuntu-latest
          - name: Ubuntu ARM64
            runner: ubuntu-24.04-arm
          - name: Windows x64
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.9"

      - name: Install Ubuntu GUI runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Run unit tests (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install -r requirements-test.txt
          # Qt offscreen native state cannot safely accumulate across these
          # long-lived GUI suites. Each module is isolated; those suites also
          # isolate every test case with a finite per-case and module budget.
          for test in $(find tests -maxdepth 1 -name 'test_*.py' -printf '%f\n' | sort); do
            module="tests.${test%.py}"
            echo "=== $module ==="
            case "$module" in
              tests.test_gui_interlocks|tests.test_gui_smoke|tests.test_gui_updater)
                timeout --signal=TERM --kill-after=10s 300 python scripts/run_unittest_module.py --split-cases --case-timeout 60 "$module"
                ;;
              *)
                timeout --signal=TERM 60 python scripts/run_unittest_module.py "$module"
                ;;
            esac
          done

      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install -r requirements-test.txt
          # PySide/Qt native state can leak across unittest modules on Windows
          # runners and terminate the shared interpreter without a Python
          # traceback. Run each module in a fresh process; split the long-lived
          # GUI suites by test case so each case gets a fresh Qt lifecycle.
          $tests = Get-ChildItem tests -Filter 'test_*.py' | Sort-Object Name
          $resultDir = Join-Path $env:RUNNER_TEMP 'b300-unit-results'
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          foreach ($test in $tests) {
            $module = 'tests.' + $test.BaseName
            $resultFile = Join-Path $resultDir ($test.BaseName + '.txt')
            Remove-Item $resultFile -Force -ErrorAction SilentlyContinue
            $env:B300_UNITTEST_RESULT_FILE = $resultFile
            Write-Host "=== $module ==="
            if ($module -in @('tests.test_gui_interlocks','tests.test_gui_smoke','tests.test_gui_updater')) {
              python scripts/run_unittest_module.py --split-cases --case-timeout 60 $module
            } else {
              python scripts/run_unittest_module.py $module
            }
            $exitCode = $LASTEXITCODE
            $verdict = if (Test-Path $resultFile) { (Get-Content $resultFile -Raw).Trim() } else { '' }
            if ($exitCode -ne 0 -and $verdict -eq 'PASS') {
              Write-Warning "$module passed unittest assertions but Qt native teardown returned $exitCode; accepting verified PASS sentinel."
              $global:LASTEXITCODE = 0
              continue
            }
            if ($exitCode -ne 0) { exit $exitCode }
            if ($verdict -ne 'PASS') {
              Write-Error "$module exited without a verified PASS sentinel."
              exit 1
            }
          }
          Remove-Item Env:B300_UNITTEST_RESULT_FILE -ErrorAction SilentlyContinue
          exit 0

      - name: Compile Python sources
        run: >-
          python -m py_compile
          b300_stlink.py
          b300_gui_entry.py
          build_native_bundle.py
          package_internal.py
          packaging/build_gui.py
          scripts/install_skill.py
          scripts/run_unittest_module.py

      - name: Compile packages
        run: python -m compileall -q b300_core b300_gui

      - name: Check CLI help
        run: |
          python b300_stlink.py --help
          python b300_stlink.py debug --help
          python -m b300_gui --smoke-test
          python scripts/install_skill.py --help
