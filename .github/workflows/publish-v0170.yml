name: Publish verified B300 v0.17.0

on:
  push:
    branches:
      - "publish/v0.17.0"

permissions:
  contents: write
  actions: read

env:
  SOURCE_SHA: 111e106a1d8d860737e590641a692bc2d165ce4b
  VERSION: 0.17.0
  TAG: v0.17.0
  PUBLISH_BRANCH: publish/v0.17.0

jobs:
  publish:
    runs-on: ubuntu-22.04
    environment: release
    timeout-minutes: 75
    steps:
      - name: Verify immutable production source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)
          test "$main_sha" = "$SOURCE_SHA"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; refusing to move or overwrite it."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing duplicate publication."
            exit 1
          fi

      - name: Wait for exact-head development package build
        id: package_run
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 150); do
            runs=$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/release-dry-run.yml/runs" \
              -f branch="$PUBLISH_BRANCH" -f event=push -f per_page=20)
            run_id=$(printf '%s' "$runs" | jq -r --arg sha "$PUBLISH_HEAD" \
              '.workflow_runs[] | select(.head_sha == $sha) | .id' | head -n 1)
            if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
              status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)
              conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // ""')
              echo "package run ${run_id}: ${status} ${conclusion}"
              if [ "$status" = "completed" ]; then
                test "$conclusion" = "success"
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "Waiting for exact-head package run for ${PUBLISH_HEAD}..."
            fi
            sleep 15
          done
          echo "Timed out waiting for exact-head development package build."
          exit 1

      - name: Checkout exact production commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify source version and release notes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python -m b300_version --check "$VERSION"
          python -m scripts.release.validate_version --check-tag "$TAG"
          python -m scripts.release.changelog "$VERSION" --output release-notes.md
          test -s release-notes.md

      - name: Download exact-head package artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.package_run.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p staging/windows staging/linux-x64 staging/linux-arm64 release-assets
          gh run download "$RUN_ID" -n dry-run-windows -D staging/windows
          gh run download "$RUN_ID" -n dry-run-linux-x64 -D staging/linux-x64
          gh run download "$RUN_ID" -n dry-run-linux-arm64 -D staging/linux-arm64

          required=(
            B300-STLink-GUI-Windows-x64.exe
            B300-STLink-GUI-Windows-x64.zip
            B300-STLink-CLI-Windows-x64.zip
            B300-STLink-GUI-Ubuntu-x64.AppImage
            b300-stlink-gui_amd64.deb
            B300-STLink-CLI-Linux-x64.tar.gz
            B300-STLink-GUI-Ubuntu-arm64.AppImage
            b300-stlink-gui_arm64.deb
            B300-STLink-CLI-Linux-arm64.tar.gz
          )
          for asset in "${required[@]}"; do
            source=$(find staging -type f -name "$asset" -print -quit)
            test -n "$source"
            cp "$source" "release-assets/$asset"
          done
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 9

      - name: Generate deterministic release metadata
        run: |
          set -euo pipefail
          published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python -m scripts.release.build_metadata \
            --asset-dir release-assets \
            --version "$VERSION" \
            --commit "$SOURCE_SHA" \
            --published-at "$published_at" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" \
            --release-page "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            --notes-file release-notes.md
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 13

      - name: Sign and verify manifests
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$MINISIGN_SECRET_KEY"
          test -n "$MINISIGN_PUBLIC_KEY"
          minisign_archive="$RUNNER_TEMP/minisign-0.12-linux.tar.gz"
          curl -fL --retry 3 -o "$minisign_archive" \
            "https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz"
          echo "9A599B48BA6EB7B1E80F12F36B94CECA7C00B7A5173C95C3EFC88D9822957E73  $minisign_archive" | sha256sum -c -
          tar -xzf "$minisign_archive" -C "$RUNNER_TEMP"
          minisign_bin="$RUNNER_TEMP/minisign-linux/x86_64/minisign"
          chmod +x "$minisign_bin"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          chmod 600 "$RUNNER_TEMP/minisign.key"
          "$minisign_bin" -S -W -s "$RUNNER_TEMP/minisign.key" -m release-assets/release-manifest.json -x release-assets/release-manifest.json.minisig
          "$minisign_bin" -S -W -s "$RUNNER_TEMP/minisign.key" -m release-assets/latest.json -x release-assets/latest.json.minisig
          "$minisign_bin" -S -W -s "$RUNNER_TEMP/minisign.key" -m release-assets/latest-cli.json -x release-assets/latest-cli.json.minisig
          "$minisign_bin" -Vm release-assets/release-manifest.json -x release-assets/release-manifest.json.minisig -P "$MINISIGN_PUBLIC_KEY"
          "$minisign_bin" -Vm release-assets/latest.json -x release-assets/latest.json.minisig -P "$MINISIGN_PUBLIC_KEY"
          "$minisign_bin" -Vm release-assets/latest-cli.json -x release-assets/latest-cli.json.minisig -P "$MINISIGN_PUBLIC_KEY"
          rm -f "$RUNNER_TEMP/minisign.key"
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 16

      - name: Create immutable-target draft release and upload 16 assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          gh release create "$TAG" \
            --target "$SOURCE_SHA" \
            --title "B300 ST-Link Tools v${VERSION}" \
            --notes-file release-notes.md \
            --draft
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_SHA"
          gh release upload "$TAG" release-assets/* --clobber
          test "$(gh release view "$TAG" --json assets --jq '.assets | length')" -eq 16

      - name: Publish as Latest and verify signed updater state
        env:
          GH_TOKEN: ${{ github.token }}
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "false"
          test "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" = "false"
          python -m scripts.release.verify_published \
            --version "$VERSION" --audience gui \
            --manifest-url "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json" \
            --signature-url "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json.minisig" \
            --minisign "$RUNNER_TEMP/minisign-linux/x86_64/minisign" \
            --public-key "$MINISIGN_PUBLIC_KEY" --attempts 8 --delay 5 --timeout 30
          python -m scripts.release.verify_published \
            --version "$VERSION" --audience cli \
            --manifest-url "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest-cli.json" \
            --signature-url "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest-cli.json.minisig" \
            --minisign "$RUNNER_TEMP/minisign-linux/x86_64/minisign" \
            --public-key "$MINISIGN_PUBLIC_KEY" --attempts 8 --delay 5 --timeout 30
          for asset in \
            B300-STLink-GUI-Windows-x64.exe \
            B300-STLink-GUI-Ubuntu-x64.AppImage \
            B300-STLink-GUI-Ubuntu-arm64.AppImage \
            latest.json latest.json.minisig latest-cli.json latest-cli.json.minisig; do
            curl -fIL --retry 8 --retry-all-errors --retry-delay 5 \
              "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${asset}"
          done
