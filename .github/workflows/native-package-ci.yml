name: Native Package CI

on:
  pull_request:
    paths:
      - "native/**"
      - "b300_core/native_debug_core.py"
      - "b300_gui_entry.py"
      - "b300_gui.spec"
      - "b300_gui_windows.spec"
      - "scripts/build_native_release_extension.py"
      - ".github/workflows/native-package-ci.yml"
  push:
    branches:
      - "**"
    paths:
      - "native/**"
      - "b300_core/native_debug_core.py"
      - "b300_gui_entry.py"
      - "b300_gui.spec"
      - "b300_gui_windows.spec"
      - "scripts/build_native_release_extension.py"
      - ".github/workflows/native-package-ci.yml"

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            name: Ubuntu x64
          - runner: ubuntu-24.04-arm
            name: Ubuntu ARM64
    name: ${{ matrix.name }} packaged native bridge
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3-dev
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt -r requirements-native-build.txt
      - name: Build and verify native extension
        run: python scripts/build_native_release_extension.py --github-env
      - name: Package GUI with native extension
        run: python -m PyInstaller --noconfirm --clean b300_gui.spec
      - name: Smoke-test packaged native backend
        run: ./dist/b300-stlink-gui --native-core-selftest

  windows:
    name: Windows x64 packaged native bridge
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt -r requirements-native-build.txt
      - name: Build and verify native extension
        run: python scripts/build_native_release_extension.py --github-env
      - name: Package GUI with native extension
        run: python -m PyInstaller --noconfirm --clean b300_gui_windows.spec
      - name: Smoke-test packaged native backend
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\b300-stlink-gui\b300-stlink-gui.exe `
            -ArgumentList --native-core-selftest -Wait -PassThru -WindowStyle Hidden
          exit $process.ExitCode
