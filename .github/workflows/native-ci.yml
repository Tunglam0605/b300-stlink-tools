name: Native C++ CI

on:
  push:
    paths:
      - "native/**"
      - "requirements-native-build.txt"
      - "scripts/native_bridge_smoke.py"
      - ".github/workflows/native-ci.yml"
      - "docs/plans/0.17.0-native-debug-core.md"
  pull_request:
    paths:
      - "native/**"
      - "requirements-native-build.txt"
      - "scripts/native_bridge_smoke.py"
      - ".github/workflows/native-ci.yml"
      - "docs/plans/0.17.0-native-debug-core.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.name }} / C++17
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x64
            runner: ubuntu-latest
          - name: Ubuntu ARM64
            runner: ubuntu-24.04-arm
          - name: Windows x64
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install native bridge build dependency
        run: python -m pip install -r requirements-native-build.txt

      - name: Configure
        run: cmake -S native/b300_debug_core -B build/native -DB300_NATIVE_BUILD_TESTS=ON -DB300_NATIVE_BUILD_PYTHON=ON -DCMAKE_BUILD_TYPE=Release -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"

      - name: Build
        run: cmake --build build/native --config Release --parallel

      - name: Test
        run: ctest --test-dir build/native -C Release --output-on-failure

      - name: Smoke-test Python bridge
        run: python scripts/native_bridge_smoke.py build/native
